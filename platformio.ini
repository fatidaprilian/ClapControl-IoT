; PlatformIO Project Configuration File
;
; Build target: ESP32 DevKit V1 with Blynk WiFi control.
; Current wiring: relay IN on GPIO2 / D2, KY-037 DO on GPIO22 / D22.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  blynkkk/Blynk
