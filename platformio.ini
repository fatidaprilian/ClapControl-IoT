; PlatformIO Project Configuration File
;
; Build target: ESP32 DevKit V1 WiFi web controller.
; Current wiring: relay drive on GPIO25 / D25, KY-037 DO on GPIO35 / D35,
; and KY-037 AO on GPIO34 / D34.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
  tzapu/WiFiManager
